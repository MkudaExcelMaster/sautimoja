<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAUTI MOJA VIJANA GROUP HOLILI</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SheetJS Excel Export Library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-light">

    <!-- =====================================
         LOGIN SECTION
    ====================================== -->
    <div id="loginPage" class="container mt-5" style="max-width: 450px;">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 text-center">
                <i class="fa-solid fa-users-rectangle fa-3x text-primary mb-3"></i>
                <h4 class="fw-bold mb-1 text-primary">SAUTI MOJA VIJANA GROUP</h4>
                <p class="text-muted small mb-4">HOLILI - KILIMANJARO</p>

                <form id="loginForm" onsubmit="login(event)">
                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold">Ingia Kama:</label>
                        <select id="userRole" class="form-select form-select-lg">
                            <option value="mwanachama">Mwanachama (Kusoma Tu)</option>
                            <option value="katibu">Katibu (Usimamizi / Admin)</option>
                        </select>
                    </div>

                    <!-- Kibox cha Password ambacho kitaonekana Katibu akichaguliwa -->
                    <div id="passwordField" class="mb-3 text-start" style="display: none;">
                        <label class="form-label fw-bold">Nenosiri la Katibu (Password):</label>
                        <input type="password" id="loginPassword" class="form-control form-control-lg" placeholder="Weka password...">
                    </div>

                    <div id="loginError" class="alert alert-danger p-2 small mb-3" style="display: none;">
                        Nenosiri siyo sahihi! Jaribu tena.
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 shadow-sm">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Ingia Kwenye Mfumo
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- =====================================
         MAIN SYSTEM DASHBOARD
    ====================================== -->
    <div id="mainPage" class="container-fluid py-4" style="display: none;">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-3 shadow-sm">
            <div>
                <h3 class="fw-bold text-primary mb-0"><i class="fa-solid fa-layer-group me-2"></i>SAUTI MOJA GROUP</h3>
                <small class="text-muted">Mfumo wa Utunzaji Kumbukumbu za Kikundi</small>
            </div>
            <div>
                <span id="roleBadge" class="badge bg-success me-2 p-2">MWANACHAMA</span>
                <button id="btnLogout" class="btn btn-outline-danger btn-sm">
                    <i class="fa-solid fa-power-off me-1"></i> Ondoka
                </button>
            </div>
        </div>

        <!-- Summary Widgets / Dashboard -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm bg-primary text-white p-3">
                    <small>Jumla ya Hisa Zote</small>
                    <h4 id="totalHisa" class="fw-bold mb-0">0 TSh</h4>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm bg-success text-white p-3">
                    <small>Jumla ya Mfuko wa Afya</small>
                    <h4 id="totalAfya" class="fw-bold mb-0">0 TSh</h4>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm bg-info text-white p-3">
                    <small>Jumla ya Mfuko wa Jamii</small>
                    <h4 id="totalJamii" class="fw-bold mb-0">0 TSh</h4>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm bg-danger text-white p-3">
                    <small>Jumla ya Faini Zote</small>
                    <h4 id="totalFaini" class="fw-bold mb-0">0 TSh</h4>
                </div>
            </div>
        </div>

        <!-- Toolbar (Search & Export) -->
        <div class="row mb-4 align-items-center">
            <div class="col-md-6 mb-2 mb-md-0">
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="fa-solid fa-search text-muted"></i></span>
                    <input type="text" id="searchInput" class="form-control" placeholder="Tafuta mwanachama kwa jina au namba...">
                </div>
            </div>
            <div class="col-md-6 text-md-end">
                <button id="btnExport" class="btn btn-success me-2">
                    <i class="fa-solid fa-file-excel me-1"></i> Pakua Excel
                </button>
                <button id="btnPrint" class="btn btn-secondary">
                    <i class="fa-solid fa-print me-1"></i> Chapisha (Print)
                </button>
            </div>
        </div>

        <!-- Members Grid Cards -->
        <div id="membersList" class="row">
            <!-- Dynamic Cards Will Load Here from JS -->
        </div>
    </div>

    <!-- =====================================
         MODAL FOR ENTERING TODAY'S DATA
    ====================================== -->
    <div class="modal fade" id="dataModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-pen-to-square me-2"></i>Ingiza Michango ya Leo</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="dataForm">
                    <div class="modal-body">
                        <input type="hidden" id="dataMemberId">
                        
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Hisa za Leo (TSh):</label>
                                <input type="number" id="d_hisa" class="form-control" value="0" min="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Afya (TSh):</label>
                                <input type="number" id="d_afya" class="form-control" value="0" min="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Jamii (TSh):</label>
                                <input type="number" id="d_jamii" class="form-control" value="0" min="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Faini 1 (TSh):</label>
                                <input type="number" id="d_faini1" class="form-control" value="0" min="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Faini 2 (TSh):</label>
                                <input type="number" id="d_faini2" class="form-control" value="0" min="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Faini 3 (TSh):</label>
                                <input type="number" id="d_faini3" class="form-control" value="0" min="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-danger">Mkopo Wa Hisa Aliochukua (TSh):</label>
                                <input type="number" id="d_mkopo_hisa" class="form-control" value="0" min="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-success">Marejesho ya Mkopo Wa Hisa (TSh):</label>
                                <input type="number" id="d_hisa_lipwa" class="form-control" value="0" min="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-danger">Mkopo Wa Jamii Aliochukua (TSh):</label>
                                <input type="number" id="d_mkopo_jamii" class="form-control" value="0" min="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-success">Marejesho ya Mkopo Wa Jamii (TSh):</label>
                                <input type="number" id="d_jamii_lipwa" class="form-control" value="0" min="0">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Ghairi</button>
                        <button type="submit" class="btn btn-success fw-bold"><i class="fa-solid fa-floppy-disk me-1"></i> Hifadhi Supabase Live</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Main Custom JS -->
    <script src="script.js"></script>
</body>
</html>
